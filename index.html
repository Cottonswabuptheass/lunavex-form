<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฟอร์มสมัครเข้าแคลน</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>สมัครเข้าแคลน</h2>
    <form id="clanForm">
        <div class="form-group">
            <label for="nickname">ชื่อเล่น:</label>
            <input type="text" id="nickname" required placeholder="กรอกชื่อเล่นของคุณ">
        </div>

        <div class="form-group">
            <label for="uid">UID:</label>
            <input type="text" id="uid" required placeholder="กรอก UID ในเกม">
        </div>

        <div class="form-group">
            <label for="age">อายุ:</label>
            <input type="number" id="age" required placeholder="กรอกอายุของคุณ">
        </div>

        <div class="form-group">
            <label for="reason">เหตุผลที่อยากเข้า:</label>
            <textarea id="reason" required placeholder="ทำไมถึงอยากเข้าแคลนนี้?"></textarea>
        </div>

        <div class="form-group">
            <label for="facebook">เฟสบุ๊ค / ช่องทางติดต่อ:</label>
            <input type="text" id="facebook" required placeholder="ลิงก์เฟสบุ๊ค หรือ ไอดีไลน์">
        </div>

        <button type="submit" id="submitBtn">ส่งใบสมัคร</button>
    </form>
</div>

<script>
  document.getElementById('clanForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = 'กำลังส่งข้อมูล...';
    submitBtn.disabled = true;

    const data = {
      nickname: document.getElementById('nickname').value,
      uid: document.getElementById('uid').value,
      age: document.getElementById('age').value,
      reason: document.getElementById('reason').value,
      facebook: document.getElementById('facebook').value
    };

    // ลิงก์ Web App URL ของ Google Apps Script
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyB0UvvbBK0uhaXhKomlnduRet6MW0Tubp3caIHaBm1VKiwoF1ex3ceVySvLEhBdv0_aQ/exec';

    fetch(webAppUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(() => {
      alert('ส่งใบสมัครเรียบร้อยแล้ว!');
      document.getElementById('clanForm').reset();
      submitBtn.innerText = 'ส่งใบสมัคร';
      submitBtn.disabled = false;
    })
    .catch(error => {
      alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
      submitBtn.innerText = 'ส่งใบสมัคร';
      submitBtn.disabled = false;
    });
  });
</script>

</body>
</html>
